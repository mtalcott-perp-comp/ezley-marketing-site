# ---------- /cars, /cameras, /furniture coming-soon (FR-MKT-023) ----------
coming_soon:
  cars:
    subbrand_chip: "Ezley Motors"
    title_pattern: "Ezley Motors — Used Cars (coming soon) | Ezley"
    headline:      "Ezley Motors — peer-to-peer used cars, agent-assisted."
    wedge_thesis:  >-
                   Used cars are the largest peer-to-peer category in the US.
                   Buyers and sellers want escrow because a $40K wire to a stranger
                   is what stops the deal today. Agents want a marketplace that
                   doesn't ban them. Ezley Motors launches when the W1 farm-equipment
                   wedge proves the trust model.
    eta:           "Launching after W1 closed-beta proves the model. Target: late 2026."
  cameras:
    subbrand_chip: "Ezley Gear"
    title_pattern: "Ezley Gear — Cameras, Instruments, Bicycles, Tools (coming soon) | Ezley"
    headline:      "Ezley Gear — mid-AOV durable goods with the same trust model."
    wedge_thesis:  >-
                   Cameras, musical instruments, bicycles, and power tools are
                   passionate-community goods that move on Facebook groups and
                   Craigslist with trust gaps. Ezley Gear gives them the same
                   escrow + identity infrastructure built for farm equipment.
    eta:           "Target: 2027."
  furniture:
    subbrand_chip: "Ezley Home"
    title_pattern: "Ezley Home — Furniture, Appliances, Sporting Goods, Collectibles (coming soon) | Ezley"
    headline:      "Ezley Home — long-tail goods on the same trust layer."
    wedge_thesis:  >-
                   Furniture, appliances, sporting goods, and collectibles round
                   out the horizontal thesis. Same escrow, same identity, same
                   dispute model — local pickup at smaller AOV.
    eta:           "Target: 2027–2028."

# ---------- /how-it-works (US3) ----------
how_it_works:
  hero_headline:   "How a transaction works on Ezley."
  buyer:
    section_title: "If you're buying"
    steps:
      - "Browse listings — every Listing has a category, structured spec, photos, price, and seller."
      - "Make an Offer — propose your price; seller accepts, counters, or declines."
      - "Buyer funds Escrow — your money is Captured into the Ezley escrow account (operated via Stripe Connect), not the seller's account."
      - "Handover — you and the seller arrange the physical handover, in person or with a coordinated carrier."
      - "Buyer confirms receipt — you mark the Transaction as received."
      - "Auto-release — when the window you chose at offer-accept passes, escrow releases to the seller. Confirming receipt yourself releases it sooner. If you spot a problem after release, you still have a window to open a dispute and freeze the funds."
      - "Seller paid — funds settle to the seller's bank within about 9 days of release."
  seller:
    section_title: "If you're selling"
    steps:
      - "Create a Listing — title, description, photos, price, structured fields for your category."
      - "Concierge reviewing — usually under 2 hours. (Tier-based auto-approve for trusted sellers; first listings and high-AOV listings get a quick concierge look.)"
      - "Listing goes Live."
      - "Buyer funds Escrow — when an Offer is accepted."
      - "Handover — arrange with the buyer."
      - "Buyer confirms receipt — or the agreed auto-release window passes."
      - "Auto-release — escrow Releases to your Connect account."
      - "Paid out — funds settle to your bank."
  identity:
    section_title: "Identity verification"
    intro:         "Every seller and buyer has a verification tier visible on their profile."
    tiers:
      - name: "BASIC"
        meaning: "Email verified. New accounts start here."
      - name: "VERIFIED"
        meaning: "Email + phone + government ID. Required to sell above per-category thresholds."
      - name: "TRUSTED_SELLER"
        meaning: "Email + phone + government ID + address + transaction history. Auto-approved listings, faster payout."
  disputes:
    section_title: "Disputes"
    intro:         >-
                   Disputes follow a defined process. If you and the other party
                   can't resolve a problem directly, you can open a dispute on
                   the transaction. A named Ezley operator handles each case,
                   with documented adjudication steps and the right to escalate.


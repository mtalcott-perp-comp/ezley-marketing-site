# ---------- /trust (depth) ----------
trust:
  hero_headline:   "Trust is the product."
  intro:           >-
                   Trust is what Ezley is built on. Escrow, identity
                   verification, dispute resolution, and concierge are the
                   foundations.
  buyer_funds_held:
    title:         "Your money stays in escrow"
    body:          >-
                   Your money is held in escrow until handover is confirmed and a
                   review window passes. You can confirm receipt yourself, or the
                   agreed window passes after handover and the funds release. And
                   if something turns out wrong after release — wrong item, missing
                   parts, damage you didn't catch at handover, never delivered —
                   you still have a window to open a dispute. Filing a dispute
                   freezes the funds while it's worked out.
  wire_or_ach:
    title:         "Above a certain price, card payment isn't offered"
    body:          >-
                   Above a certain price (we'll show it at checkout), card
                   payment isn't offered. Wire and ACH are the path because
                   they're both safer and cheaper for transactions this size.
  # Note: any dispute-statistics or SLA-target callout is intentionally
  # absent from /trust at M0 per the spec's tightened FR-MKT-055.
  # F-MKT-003 (post-M9) is the spec that publishes measured statistics
  # once we have real volume.

# ---------- /agents (US5) ----------
agents:
  hero_headline:   "Agents are first-class on Ezley."
  intro:           >-
                   AI buying and selling agents — ChatGPT, Claude, Gemini,
                   Perplexity, bespoke buyer agents — are first-class citizens
                   of the marketplace, not edge cases.
  posture:         >-
                   Ezley does not block agent traffic except for fraud or
                   abuse, and never solely for being agent traffic.
  discovery:
    title:         "Agent-discovery surface"
    links:
      - { label: "llms.txt", url: "/llms.txt" }
      - { label: "mcp.json", url: "/mcp.json" }
      - { label: "sitemap.xml", url: "/sitemap.xml" }
      - { label: "robots.txt", url: "/robots.txt" }

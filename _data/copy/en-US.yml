# All user-facing strings live here (NFR-MKT-011 — localization-ready).
# Pages reference these via {{ site.data.copy.en-US.<path> }}.
# When Spanish localization lands (M18 per P-08), a sibling file at
# _data/copy/es-MX.yml mirrors this structure.

# ---------- Home page (US1) ----------
home:
  hero:
    headline_vision: "The open marketplace for high-trust, high-value, peer-to-peer commerce."
    headline_trust:  "Your money stays in escrow until you confirm what you bought."
    cta_primary:     "Browse listings"
    cta_secondary:   "Start selling"
  why_ezley:
    section_title:   "Why Ezley"
    rows:
      - name: "Facebook Marketplace"
        differentiator: "Captures the conversation but provides no transaction layer."
        anchor: "Escrow-held funds, identity-verified sellers."
      - name: "Craigslist"
        differentiator: "Captures the listing but provides no trust layer."
        anchor: "Escrow, identity verification, dispute process."
      - name: "General auction marketplaces"
        differentiator: "Banned AI shopping assistants from buying on the platform in early 2026 (eBay's 2026-02-20 policy change)."
        anchor: "Your AI assistant — ChatGPT, Claude, Gemini — can browse, compare, and buy on Ezley."
      - name: "Category-specific catalog sites"
        differentiator: "Catalog without escrow. You find the listing — and you're on your own."
        anchor: "Ezley operates the trust layer the catalog leaves out."
  trust_signals:
    - "Wire payment supported on high-value transactions"
    - "Buyer funds held in escrow until handover confirmed"
    - "Identity-verified sellers"
    - "Concierge support in your county"
  how_it_works_preview:
    section_title: "How it works"
    buyer_flow:    "Browse → Offer → Buyer funds Escrow → Handover → Buyer confirms → Auto-release → Seller paid"
    seller_flow:   "List → Concierge auto-approves (or reviews per tier) → Live → Buyer funds Escrow → Handover → Buyer confirms → Auto-release → Paid out"
  pricing_teaser:  "Free to list. Pay only when you sell."

# ---------- /tractors (US2) ----------
